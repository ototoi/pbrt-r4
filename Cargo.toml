[package]
name = "pbrt-r4"
version = "4.3.1"
edition = "2021"
build = "build/main.rs"
default-run = "pbrt-r4"
authors = ["Toru Matsuoka <tx.matsuoka@gmail.com>"]
categories = ["graphics", "rendering", "command-line-utilities", "concurrency"]
keywords = ["pbrt", "ray-tracing", "rendering", "global-illumination"]
description = "A Rust implementation of pbrt-v4"
repository = "https://github.com/ototoi/pbrt-r4"
license = "Apache-2.0"
readme = "README.md"

[features]
default = ["webgpu"]
stats = []
float-as-double = []
cuda = []
webgpu = ["dep:bytemuck", "dep:glam", "dep:pollster", "dep:wgpu"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "=4.4.10", features = ["derive", "env"] }
env_logger = "=0.10.1"
exr = "=1.74.0"
flate2 = "=1.1.0"
half = "=2.5.0"
image = "=0.24.5"
indicatif = "=0.17.3"
log = "=0.4.29"
bytemuck = { version = "=1.25.0", features = ["derive"], optional = true }
glam = { version = "=0.33.1", features = ["bytemuck"], optional = true }
nanovdb-rs = "=0.0.7"
nom = "=7.1.1"
pollster = { version = "=0.4.0", optional = true }
ply-rs = "=0.1.3"
qoi = "=0.4.1"
rayon = "=1.7.0"
rust-crypto = "=0.2.36"
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "=1.0.104"
tar = "=0.4.44"
tempfile = "=3.19.1"

# webgpu

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "vulkan",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "metal",
] }

[dev-dependencies]
libm = "=0.2.11"

#[profile.release]
#opt-level = 3
#lto = "fat"
#codegen-units = 1

[profile.dev.build-override]
opt-level = 3

[lints.clippy]
needless_return = "allow"
arc_with_non_send_sync = "allow"
excessive_precision = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
redundant_field_names = "allow"
identity_op = "allow"
erasing_op = "allow"
bool_assert_comparison = "allow"

[[bin]]
name = "pbrt-r4"
path = "src/cmd/pbrt.rs"

[[bin]]
name = "plytool"
path = "src/cmd/plytool.rs"

[[bin]]
name = "imgtool"
path = "src/cmd/imgtool/mod.rs"

[[bin]]
name = "cyhair2pbrt"
path = "src/cmd/cyhair2pbrt.rs"

[[bin]]
name = "nanovdb2pbrt"
path = "src/cmd/nanovdb2pbrt.rs"

[[bin]]
name = "pspec"
path = "src/cmd/pspec.rs"

# `[profile.release]` left at cargo defaults (opt-level=3, no LTO).
# We tried `lto = "fat"` + `codegen-units = 1`: small win (~5%) on the
# BSSRDF-heavy head.pbrt path but slightly regressed (5-10%) simple
# sphere scenes, and tripled the link step. `lto = "thin"` was a wash.
# Leaving it off keeps `cargo build --release` snappy (~8 s).
